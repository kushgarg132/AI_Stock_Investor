name: ai-stock-investor
# Backend rebuilds+redeploys are automated: pushes to main that touch
# backend/** or this file trigger .github/workflows/deploy-backend.yml on the
# VM's self-hosted runner.
#
# Mongo and Redis are managed cloud services (Atlas + Upstash, same ones the
# Render deployment used) -- not containers here. See MONGODB_URL/REDIS_URL
# in .env.

services:
  backend:
    build:
      context: ./backend
    container_name: ai-stock-investor-backend
    restart: unless-stopped
    environment:
      MONGODB_URL: ${MONGODB_URL}
      DATABASE_NAME: ${DATABASE_NAME:-stock_investor_db}
      REDIS_URL: ${REDIS_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - default
      - routineos_default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
    container_name: ai-stock-investor-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

networks:
  default:
  routineos_default:
    external: true
